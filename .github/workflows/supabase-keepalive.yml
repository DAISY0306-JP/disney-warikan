# Supabase の無料プランは、1週間アクセスがないとプロジェクトが休止する。
# 週に2回、データベースに軽く問い合わせて、休止しないようにする。
# （ここで使う URL と anon キーは、アプリ（app.js）にも書かれている公開用のもの。データは読めない）
name: Supabase keepalive

on:
  schedule:
    - cron: '17 3 * * 1,4' # 毎週 月・木 12:17（日本時間）
  workflow_dispatch: # Actions の画面から手動でも動かせる

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase に問い合わせる
        env:
          SUPABASE_URL: https://kfmcjbxwwafvzltchpfb.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtmbWNqYnh3d2FmdnpsdGNocGZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDg4NTEsImV4cCI6MjA5NzQyNDg1MX0.29e39nDUgOd7H91n5ZaddqSsjOI3SDWTfA-FbyR5rck
        run: |
          # trips テーブルへの問い合わせ。anon には読む権限がないので「権限なし（42501）」が返るが、
          # これはデータベースが実際に答えたということなので、アクセスとして数えられる
          body=$(curl -sS --retry 3 --retry-delay 10 -w '\nHTTP %{http_code}' \
            "$SUPABASE_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$body"
          echo "$body" | grep -Eq 'HTTP 200|"42501"' || { echo "::error::Supabase が応答しません（休止中ならダッシュボードで Restore してください）"; exit 1; }
          # 認証サーバーの状態も確認
          curl -sS --fail --retry 3 --retry-delay 10 "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY" -o /dev/null
